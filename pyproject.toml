
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nyc_taxi"
version = "0.1.0"
description = "NYC Taxi Data Platform — Azure Data Platform Reference Architecture"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.0",
    "delta-spark==3.1.0",
    "azure-identity==1.15.0",
    "azure-storage-file-datalake==12.14.0",
    "pyarrow==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "chispa==0.9.2",
    "duckdb==0.10.0",
    "black==23.12.0",
    "isort==5.13.0",
    "ruff==0.1.9",
    "pre-commit==3.6.0",
]

# ─── Entry points (DABs wheel tasks call these) ───────────────────────────────
[project.scripts]
run_bronze = "nyc_taxi.bronze.ingest:main"
run_silver = "nyc_taxi.silver.transform:main"
run_gold   = "nyc_taxi.gold.aggregate:main"

# ─── Tool configuration ───────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]

[tool.setuptools.packages.find]
where = ["src"]
